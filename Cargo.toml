[package]
name = "facewatch"
version = "0.1.0"
edition = "2024"
description = "A webcam face recognition app built on the pupi push-pipeline, using SCRFD + AuraFace ONNX models through ort."
license = "MIT OR Apache-2.0"

[dependencies]
pupi = { path = "../pupi" }
ort = "2.0.0-rc.13"
ndarray = "0.17"
gstreamer = "0.24"
gstreamer-app = "0.24"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
anyhow = "1"
ureq = "3"
sha2 = "0.10"

[profile.release]
lto = "thin"